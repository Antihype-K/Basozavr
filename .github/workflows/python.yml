name: Python

on:
  push:
    paths: ["Python/**", "Tools/NetMQHost/**", "Assets/Scripts/Apps/NetMQServer/**", "Assets/Scripts/uDTP/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["Python/**", "Tools/NetMQHost/**", "Assets/Scripts/Apps/NetMQServer/**", "Assets/Scripts/uDTP/**", ".github/workflows/python.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: Python
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            Python
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
        env:
          MPLBACKEND: Agg

  # Python client against the real C# NetMQ server code (Tools/NetMQHost)
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Python
            Tools
            Assets/Scripts/Apps/NetMQServer
            Assets/Scripts/uDTP
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build Tools/NetMQHost -c Release -o Tools/NetMQHost/out
      - run: pip install -r Python/requirements-dev.txt
      - run: pytest tests/test_netmq_interop.py -v
        working-directory: Python
        env:
          NETMQ_HOST: ${{ github.workspace }}/Tools/NetMQHost/out/NetMQHost.dll
